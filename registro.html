<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registrar</title>
	<link rel="stylesheet" href="estilos/styles.css">
	<link rel="stylesheet" href="estilos/registro_login.css">
	<link rel="stylesheet" href="estilos/bodyStyle.css">
	<link rel="stylesheet" href="estilos/registro.css">
</head>
<body>
	<header id="header">

	</header>

	<main class="cuerpo">
	    <form id="form-registro">
			<h2>Registro</h2>
			<div class="form-group">
				<label for="nombre">Nombre:</label>
				<input type="text" id="nombre-registro" name="nombre" placeholder="nombre..." required>
			</div>
			<div class="form-group">
				<label for="apellido">Apellido:</label>
				<input type="text" id="apellido-registro" name="apellido" placeholder="apellido..." required>
			</div>
			<div class="form-group">
				<label for="email">Email:</label>
				<input type="email" id="email-registro" name="email" placeholder="email..." required>
			</div>
			<div class="form-group">
				<label for="password">Contraseña:</label>
				<input type="password" id="password-registro" name="password" placeholder="contraseña..." required>
			</div>
			<button type="submit">Registrar</button>
			<p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
		</form>
	</main>
	<footer id="footer">

	</footer>

</body>
<script src="script/script.js"></script>
</html>
