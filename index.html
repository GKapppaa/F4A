<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F4A Web</title>
    <link rel="stylesheet" href="estilos/styles.css">
    <link rel="stylesheet" href="estilos/bodyStyle.css">
    <link rel="stylesheet" href="estilos/registro_login.css">
</head>

<body>

    <!-- Header inyectado desde el JS -->
    <header id="header">

    </header>

    <!-- Iniciando el cuerpo de la pagina -->
    <main class="cuerpo">
        <section class="hero-banner">
            <img src="imagenes/bannerMarines.webp" alt="actualizar-dps" class="hero-banner-img">
            <div class="contenido-banner">
                <h3 class="oferta">Oferta limitada</h3>
                <h2>50%</h2>
                <a href="index.html" class="contenido-banner-btn">Comprar Ahora!</a>
            </div>
        </section>

        <section class="seccion-software">
            <div class="b-soft">
                <h3>
                    Todo lo que buscas, en un solo lugar
                </h3>
            </div>

            <div class="carrusel-software">
                <article class="tarjeta-software">
                    <a href="FFVIIR.html">
                        <div>
                            <img src="imagenes/FFVIIR.webp" alt="FFVIIR">
                        </div>
                        <div class="tarjeta">
                            <h3>
                                Final Fantasy VII Revelations
                            </h3>
                            <p class="precio">$59.990</p>
                            <button type="button">🛒</button>
                        </div>
                    </a>
                </article>
                <article class="tarjeta-software">
                    <div>
                        <img src="imagenes/excel.webp" alt="Excel">
                    </div>
                    <div class="tarjeta">
                        <h3>
                            Licencia Excel
                        </h3>
                        <p class="precio">$10.000</p>
                        <button type="button">🛒</button>
                    </div>
                </article>
                <article class="tarjeta-software">
                    <div>
                        <img src="imagenes/power.webp" alt="PowerPoint">
                    </div>
                    <div class="tarjeta">
                        <h3>
                            Licencia Power Point
                        </h3>
                        <p class="precio">$15.000</p>
                        <button type="button">🛒</button>
                    </div>
                </article>
            </div>
        </section>

    </main>

    <!-- Footer inyectado desde el JS -->
    <footer id="footer">
    </footer>

</body>
<script src="script/script.js"></script>

</html>
